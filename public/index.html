<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Tracker iOS Style</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    * { box-sizing: border-box; }
    body { 
      margin: 0; padding: 0; 
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
      background: #000; color: #fff; 
      display: flex; flex-direction: column; height: 100vh;
      overflow: hidden;
    }

    /* Indicadores Visibles de Seguimiento de Navegación */
    #navigation-tracking-indicators {
      position: absolute; top: 40px; left: 16px; right: 16px;
      background: rgba(30, 30, 30, 0.75); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
      border-radius: 14px; padding: 12px 16px; z-index: 1000;
      display: flex; align-items: center; justify-content: space-between;
      box-shadow: 0 4px 20px rgba(0,0,0,0.4);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .nav-label { font-size: 0.85rem; color: #ebebf5; font-weight: 500; }
    .nav-value { font-size: 1rem; color: #FFD60A; font-weight: 700; text-transform: uppercase; }

    /* Contenedor del Mapa (Layout Pac-Man) */
    #pacman-interface-layout { position: relative; flex-grow: 1; display: flex; flex-direction: column; }
    #map { flex-grow: 1; width: 100%; background: #1c1c1e; }

    /* Botones Flotantes (Refresh y Auto-Track) */
    .map-controls {
      position: absolute; top: 110px; right: 16px; z-index: 1000;
      display: flex; flex-direction: column; gap: 12px;
    }
    .btn-glass {
      width: 48px; height: 48px; border-radius: 14px; border: 1px solid rgba(255, 255, 255, 0.1);
      background: rgba(30, 30, 30, 0.75); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
      color: #fff; font-size: 1.2rem; display: flex; align-items: center; justify-content: center;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3); cursor: pointer; transition: all 0.2s ease;
    }
    .btn-glass:active { transform: scale(0.95); }
    .btn-glass.on { color: #FFD60A; }

    /* Bottom Sheet (Estilo App Encontrar) */
    #bottom-sheet {
      background: rgba(28, 28, 30, 0.85); backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
      border-radius: 24px 24px 0 0; display: flex; flex-direction: column;
      z-index: 1000; box-shadow: 0 -10px 25px rgba(0,0,0,0.3);
      padding: 12px 16px 25px 16px; border-top: 1px solid rgba(255, 255, 255, 0.1);
    }
    .drag-handle { width: 36px; height: 5px; background: rgba(255, 255, 255, 0.3); border-radius: 3px; margin: 0 auto 15px auto; }

    /* Menú Horizontal de Personas */
    #people-menu { 
      display: flex; overflow-x: auto; gap: 12px; padding-bottom: 16px; 
      border-bottom: 1px solid rgba(255, 255, 255, 0.1); 
      -ms-overflow-style: none; scrollbar-width: none;
    }
    #people-menu::-webkit-scrollbar { display: none; }
    .person-card {
      background: rgba(255, 255, 255, 0.05); border: 2px solid transparent; border-radius: 16px; 
      padding: 12px 20px; min-width: 100px; cursor: pointer; 
      display: flex; flex-direction: column; align-items: center; gap: 6px; transition: 0.2s;
    }
    .person-card.active { border-color: #FFD60A; background: rgba(255, 214, 10, 0.1); }
    .person-icon { font-size: 1.5rem; }
    .person-name { font-size: 0.85rem; font-weight: 600; color: #ebebf5; text-transform: capitalize; }

    /* Componente de Sección de Comida y Telemetría */
    #food-section-component { display: flex; justify-content: space-between; padding-top: 16px; }
    .stat-box { text-align: center; flex: 1; }
    .stat-val { font-size: 1.3rem; font-weight: 700; color: #fff; }
    .stat-lbl { font-size: 0.65rem; color: rgba(235, 235, 245, 0.6); text-transform: uppercase; margin-top: 4px; font-weight: 600; letter-spacing: 0.5px; }
    .stat-val.highlight { color: #FFD60A; }
  </style>
</head>
<body>

  <div id="pacman-interface-layout">
    
    <!-- Top Bar -->
    <div id="navigation-tracking-indicators">
      <div class="nav-label">Navegando hacia</div>
      <div class="nav-value" id="current-tracking-name">---</div>
    </div>

    <!-- Mapa -->
    <div id="map"></div>

    <!-- Controles -->
    <div class="map-controls">
      <button id="btn-refresh" class="btn-glass" onclick="manualRefresh()" title="Actualizar">🔄</button>
      <button id="btn-autotrack" class="btn-glass on" title="Auto-Cámara">🎯</button>
    </div>

  </div>

  <!-- Bottom Sheet Menu -->
  <div id="bottom-sheet">
    <div class="drag-handle"></div>
    
    <div id="people-menu">
      <!-- Los dispositivos se inyectarán aquí -->
    </div>

    <!-- Componente de Sección de Comida -->
    <div id="food-section-component">
      <div class="stat-box"><div class="stat-val highlight" id="val-food">0</div><div class="stat-lbl">Comida</div></div>
      <div class="stat-box"><div class="stat-val" id="val-speed">0 km/h</div><div class="stat-lbl">Velocidad</div></div>
      <div class="stat-box"><div class="stat-val" id="val-batt">--%</div><div class="stat-lbl">Batería</div></div>
      <div class="stat-box"><div class="stat-val" id="val-time">--:--</div><div class="stat-lbl">Actualizado</div></div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    // Mapa oscuro
    const map = L.map('map', { zoomControl: false }).setView([19.0433, -98.198], 15);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', { maxZoom: 19 }).addTo(map);

    const iconPacman = L.icon({
      iconUrl: 'https://upload.wikimedia.org/wikipedia/commons/4/49/Pacman.svg',
      iconSize: [32, 32],
      iconAnchor: [16, 16]
    });

    let markers = {};
    let polylines = {};
    let currentFocusId = null;
    let autoTrack = true;

    // Control de Auto-Cámara
    const btnAutoTrack = document.getElementById('btn-autotrack');
    btnAutoTrack.onclick = () => {
      autoTrack = !autoTrack;
      btnAutoTrack.className = autoTrack ? 'btn-glass on' : 'btn-glass';
    };
    map.on('dragstart', () => { if (autoTrack) btnAutoTrack.click(); });

    // Actualización Manual Animada
    async function manualRefresh() {
      const btn = document.getElementById('btn-refresh');
      btn.style.transform = 'rotate(180deg)';
      await fetchTrackerData();
      setTimeout(() => {
        btn.style.transition = 'none';
        btn.style.transform = 'rotate(0deg)';
        setTimeout(() => { btn.style.transition = 'all 0.2s ease'; }, 50);
      }, 300);
    }

    function selectDevice(id) {
      currentFocusId = id;
      document.getElementById('current-tracking-name').innerText = id;
      
      // Actualizar UI del Menú
      document.querySelectorAll('.person-card').forEach(card => card.classList.remove('active'));
      const activeCard = document.getElementById('card-' + id);
      if (activeCard) activeCard.classList.add('active');

      if (autoTrack && markers[id]) map.setView(markers[id].getLatLng(), 16);
    }

    async function fetchTrackerData() {
      try {
        const res = await fetch('/api/live');
        const data = await res.json();
        
        const deviceIds = Object.keys(data);
        if (deviceIds.length === 0) return;

        // Renderizar Menú Estilo iOS
        const menuContainer = document.getElementById('people-menu');
        if (menuContainer.children.length !== deviceIds.length) {
          menuContainer.innerHTML = '';
          deviceIds.forEach(id => {
            const card = document.createElement('div');
            card.className = `person-card ${id === currentFocusId ? 'active' : ''}`;
            card.id = `card-${id}`;
            card.onclick = () => selectDevice(id);
            card.innerHTML = `<div class="person-icon">👤</div><div class="person-name">${id}</div>`;
            menuContainer.appendChild(card);
          });
        }

        if (!currentFocusId) selectDevice(deviceIds[0]);

        deviceIds.forEach(id => {
          const { current, history } = data[id];
          if (!current) return;

          const latLng = [current.lat, current.lon];

          if (!markers[id]) {
            markers[id] = L.marker(latLng, { icon: iconPacman }).addTo(map);
          } else {
            markers[id].setLatLng(latLng);
          }

          const path = history.map(p => [p.lat, p.lon]);
          if (!polylines[id]) {
            polylines[id] = L.polyline(path, { color: '#FFD60A', weight: 4, dashArray: '5, 15', lineCap: 'round', opacity: 0.9 }).addTo(map);
          } else {
            polylines[id].setLatLngs(path);
          }
          
          if(id === currentFocusId) {
            document.getElementById('val-food').innerText = history.length;
            document.getElementById('val-speed').innerText = `${Math.round(current.speed * 3.6)}`;
            document.getElementById('val-batt').innerText = `${current.battery}%`;
            
            const timestamp = new Date(current.timestamp);
            document.getElementById('val-time').innerText = timestamp.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit', second:'2-digit'});
            
            if (autoTrack) map.setView(latLng);
          }
        });
      } catch (err) {
        console.error("Error al actualizar", err);
      }
    }

    setInterval(fetchTrackerData, 2000);
    fetchTrackerData();
  </script>
</body>
</html>
