<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Tracker Claro</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    :root {
      --bg: #f2f2f7;
      --ink: #1c1c1e;
      --muted: #8e8e93;
      --accent: #007aff;
      --danger: #ff3b30;
      --warn: #ff9500;
      --ok: #34c759;
      --card: rgba(255, 255, 255, 0.9);
      --line: rgba(0, 0, 0, 0.06);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0; padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg); color: var(--ink);
      display: flex; flex-direction: column; height: 100vh;
      overflow: hidden;
    }

    /* Barra superior: dispositivo activo + estado de conexión */
    #topbar {
      position: absolute; top: 40px; left: 16px; right: 16px;
      background: var(--card); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
      border-radius: 14px; padding: 12px 16px; z-index: 1000;
      display: flex; align-items: center; justify-content: space-between;
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
      border: 1px solid var(--line);
    }
    #topbar .info { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
    .topbar-label { font-size: 0.72rem; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.4px; }
    .topbar-value { font-size: 1.05rem; color: var(--accent); font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #conn-status { display: flex; align-items: center; gap: 6px; font-size: 0.72rem; color: var(--muted); font-weight: 600; flex-shrink: 0; }
    #conn-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); transition: background 0.2s; }
    #conn-dot.stale { background: var(--warn); }
    #conn-dot.down { background: var(--danger); }

    /* Mapa */
    #map-wrap { position: relative; flex-grow: 1; display: flex; flex-direction: column; }
    #map { flex-grow: 1; width: 100%; background: #e5e5ea; }

    /* Estado vacío / error sobre el mapa */
    #map-overlay {
      position: absolute; inset: 0; z-index: 900;
      display: none; align-items: center; justify-content: center;
      background: rgba(242,242,247,0.9); text-align: center; padding: 32px;
    }
    #map-overlay.show { display: flex; }
    #map-overlay .card { max-width: 280px; }
    #map-overlay .title { font-size: 1.05rem; font-weight: 700; margin-bottom: 6px; }
    #map-overlay .desc { font-size: 0.88rem; color: var(--muted); line-height: 1.4; }

    /* Botones flotantes */
    .map-controls {
      position: absolute; top: 110px; right: 16px; z-index: 1000;
      display: flex; flex-direction: column; gap: 12px;
    }
    .btn-glass {
      width: 48px; height: 48px; border-radius: 14px; border: 1px solid var(--line);
      background: var(--card); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
      color: var(--ink); font-size: 1.2rem; display: flex; align-items: center; justify-content: center;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08); cursor: pointer; transition: all 0.15s ease;
    }
    .btn-glass:active { transform: scale(0.93); }
    .btn-glass.on { color: var(--accent); background: #ffffff; border-color: var(--accent); }
    #btn-refresh.spinning { animation: spin 0.5s linear; }
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(180deg); } }

    /* Panel inferior: selector de dispositivos */
    #device-panel {
      background: var(--card); backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
      border-radius: 24px 24px 0 0; display: flex; flex-direction: column;
      z-index: 1000; box-shadow: 0 -10px 25px rgba(0,0,0,0.05);
      padding: 12px 16px calc(16px + env(safe-area-inset-bottom, 0px)) 16px;
      border-top: 1px solid var(--line);
    }
    .drag-handle { width: 36px; height: 5px; background: #d1d1d6; border-radius: 3px; margin: 0 auto 12px auto; }

    #device-search {
      width: 100%; border: none; background: #eeeef1; border-radius: 10px;
      padding: 9px 12px; font-size: 0.9rem; color: var(--ink); margin-bottom: 12px;
    }
    #device-search:focus { outline: 2px solid var(--accent); outline-offset: 1px; }

    #device-menu {
      display: flex; overflow-x: auto; gap: 10px; padding-bottom: 12px;
      -ms-overflow-style: none; scrollbar-width: none;
    }
    #device-menu::-webkit-scrollbar { display: none; }

    .device-card {
      background: #f2f2f7; border: 2px solid transparent; border-radius: 16px;
      padding: 10px 16px; min-width: 108px; cursor: pointer;
      display: flex; flex-direction: column; align-items: center; gap: 5px; transition: 0.15s;
      flex-shrink: 0;
    }
    .device-card.active { border-color: var(--accent); background: #e5f0ff; }
    .device-dot { width: 12px; height: 12px; border-radius: 50%; box-shadow: 0 0 0 3px rgba(0,0,0,0.04); }
    .device-name { font-size: 0.82rem; font-weight: 600; color: var(--ink); max-width: 90px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .device-batt { font-size: 0.68rem; font-weight: 700; }
    .device-batt.low { color: var(--danger); }
    .device-batt.mid { color: var(--warn); }
    .device-batt.high { color: var(--ok); }

    /* Detalle del dispositivo seleccionado */
    .telemetry-row { display: flex; justify-content: space-between; padding-top: 4px; border-top: 1px solid var(--line); }
    .stat-box { text-align: center; flex: 1; }
    .stat-val { font-size: 1.25rem; font-weight: 700; color: var(--ink); }
    .stat-lbl { font-size: 0.62rem; color: var(--muted); text-transform: uppercase; margin-top: 3px; font-weight: 700; letter-spacing: 0.5px; }
    .stat-val.accent { color: var(--accent); }

    /* Marcador del mapa (divIcon) */
    .tracker-marker { display: flex; align-items: center; justify-content: center; }
    .tracker-marker .pulse {
      position: absolute; width: 38px; height: 38px; border-radius: 50%;
      opacity: 0.35; animation: pulse 1.8s ease-out infinite;
    }
    @keyframes pulse { 0% { transform: scale(0.6); opacity: 0.45; } 100% { transform: scale(1.6); opacity: 0; } }
    .tracker-marker .puck {
      position: relative; width: 30px; height: 30px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      border: 3px solid #fff; box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    }
    .tracker-marker svg { width: 16px; height: 16px; fill: #fff; }
  </style>
</head>
<body>

  <div id="map-wrap">

    <!-- Barra superior -->
    <div id="topbar">
      <div class="info">
        <div class="topbar-label">Siguiendo</div>
        <div class="topbar-value" id="current-tracking-name">---</div>
      </div>
      <div id="conn-status">
        <div id="conn-dot"></div>
        <span id="conn-text">En vivo</span>
      </div>
    </div>

    <!-- Mapa -->
    <div id="map"></div>

    <!-- Overlay vacío / error -->
    <div id="map-overlay">
      <div class="card">
        <div class="title" id="overlay-title">Sin dispositivos</div>
        <div class="desc" id="overlay-desc">Cuando un dispositivo empiece a reportar ubicación, aparecerá aquí automáticamente.</div>
      </div>
    </div>

    <!-- Controles -->
    <div class="map-controls">
      <button id="btn-refresh" class="btn-glass" onclick="manualRefresh()" title="Actualizar">🔄</button>
      <button id="btn-autotrack" class="btn-glass on" title="Auto-cámara">🎯</button>
      <button id="btn-fitall" class="btn-glass" onclick="fitAllDevices()" title="Ver todos">⤢</button>
    </div>

  </div>

  <!-- Panel inferior: selector de dispositivos -->
  <div id="device-panel">
    <div class="drag-handle"></div>

    <input type="text" id="device-search" placeholder="Buscar dispositivo..." oninput="renderDeviceMenu()">

    <div id="device-menu"></div>

    <div class="telemetry-row">
      <div class="stat-box"><div class="stat-val" id="val-lastseen">--</div><div class="stat-lbl">Últ. actualización</div></div>
      <div class="stat-box"><div class="stat-val accent" id="val-speed">0 km/h</div><div class="stat-lbl">Velocidad</div></div>
      <div class="stat-box"><div class="stat-val" id="val-batt">--%</div><div class="stat-lbl">Batería</div></div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    // ---------- Mapa base ----------
    const map = L.map('map', { zoomControl: false }).setView([19.0433, -98.198], 15);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', { maxZoom: 19 }).addTo(map);

    // ---------- Estado ----------
    let markers = {};       // id -> L.Marker
    let polylines = {};     // id -> L.Polyline
    let deviceColors = {};  // id -> color hex
    let latestData = {};    // última respuesta completa de /api/live
    let currentFocusId = null;
    let autoTrack = true;
    let consecutiveErrors = 0;

    const PALETTE = ['#007aff', '#ff9500', '#34c759', '#af52de', '#ff3b30', '#5ac8fa', '#ffcc00', '#ff2d55'];

    function colorForDevice(id) {
      if (deviceColors[id]) return deviceColors[id];
      let hash = 0;
      for (let i = 0; i < id.length; i++) hash = (hash * 31 + id.charCodeAt(i)) >>> 0;
      const color = PALETTE[hash % PALETTE.length];
      deviceColors[id] = color;
      return color;
    }

    // Ícono SVG embebido: no depende de recursos externos, siempre carga.
    function buildIcon(id) {
      const color = colorForDevice(id);
      const html = `
        <div class="tracker-marker">
          <div class="pulse" style="background:${color};"></div>
          <div class="puck" style="background:${color};">
            <svg viewBox="0 0 24 24"><path d="M19.44 9.03L15.41 5H9.41v2h4.58l1.5 1.5H9.41l-1.5-1.5H4v2h1.83L4.13 12H2v2h1.05a3 3 0 105.9 0h6.1a3 3 0 105.88-.55L21 13.5V11l-1.56-1.97zM6.5 15.5A1.5 1.5 0 118 14a1.5 1.5 0 01-1.5 1.5zm11 0a1.5 1.5 0 111.5-1.5 1.5 1.5 0 01-1.5 1.5z"/></svg>
          </div>
        </div>`;
      return L.divIcon({ html, className: '', iconSize: [38, 38], iconAnchor: [19, 19] });
    }

    function batteryClass(level) {
      if (level <= 20) return 'low';
      if (level <= 50) return 'mid';
      return 'high';
    }

    function timeAgo(iso) {
      if (!iso) return '--';
      const diff = Math.max(0, (Date.now() - new Date(iso).getTime()) / 1000);
      if (diff < 60) return `hace ${Math.round(diff)}s`;
      if (diff < 3600) return `hace ${Math.round(diff / 60)}m`;
      return `hace ${Math.round(diff / 3600)}h`;
    }

    // ---------- Controles ----------
    const btnAutoTrack = document.getElementById('btn-autotrack');
    btnAutoTrack.onclick = () => {
      autoTrack = !autoTrack;
      btnAutoTrack.className = autoTrack ? 'btn-glass on' : 'btn-glass';
    };
    map.on('dragstart', () => { if (autoTrack) btnAutoTrack.click(); });

    function fitAllDevices() {
      const ids = Object.keys(markers);
      if (ids.length === 0) return;
      const group = L.featureGroup(ids.map(id => markers[id]));
      map.fitBounds(group.getBounds().pad(0.25));
      if (autoTrack) btnAutoTrack.click();
    }

    async function manualRefresh() {
      const btn = document.getElementById('btn-refresh');
      btn.classList.add('spinning');
      await fetchTrackerData();
      setTimeout(() => btn.classList.remove('spinning'), 400);
    }

    function selectDevice(id) {
      currentFocusId = id;
      document.getElementById('current-tracking-name').innerText = id;

      document.querySelectorAll('.device-card').forEach(card => card.classList.remove('active'));
      const activeCard = document.getElementById('card-' + id);
      if (activeCard) activeCard.classList.add('active');

      updateDetailPanel(id);
      if (autoTrack && markers[id]) map.setView(markers[id].getLatLng(), 16);
    }

    function updateDetailPanel(id) {
      const entry = latestData[id];
      if (!entry || !entry.current) return;
      document.getElementById('val-speed').innerText = `${Math.round(entry.current.speed * 3.6)} km/h`;
      document.getElementById('val-batt').innerText = `${entry.current.battery}%`;
      document.getElementById('val-lastseen').innerText = timeAgo(entry.current.timestamp);
    }

    // ---------- Menú de dispositivos ----------
    function renderDeviceMenu() {
      const query = document.getElementById('device-search').value.trim().toLowerCase();
      const menuContainer = document.getElementById('device-menu');
      menuContainer.innerHTML = '';

      const ids = Object.keys(latestData).filter(id => id.toLowerCase().includes(query));
      ids.forEach(id => {
        const entry = latestData[id];
        const batt = entry?.current?.battery ?? 0;
        const color = colorForDevice(id);

        const card = document.createElement('div');
        card.className = `device-card ${id === currentFocusId ? 'active' : ''}`;
        card.id = `card-${id}`;
        card.onclick = () => selectDevice(id);
        card.innerHTML = `
          <div class="device-dot" style="background:${color};"></div>
          <div class="device-name">${id}</div>
          <div class="device-batt ${batteryClass(batt)}">${batt}%</div>
        `;
        menuContainer.appendChild(card);
      });
    }

    // ---------- Estado de conexión ----------
    function setConnStatus(state) {
      const dot = document.getElementById('conn-dot');
      const text = document.getElementById('conn-text');
      dot.className = state;
      if (state === 'stale') text.innerText = 'Sin señal reciente';
      else if (state === 'down') text.innerText = 'Sin conexión';
      else text.innerText = 'En vivo';
    }

    function showOverlay(title, desc) {
      document.getElementById('overlay-title').innerText = title;
      document.getElementById('overlay-desc').innerText = desc;
      document.getElementById('map-overlay').classList.add('show');
    }
    function hideOverlay() {
      document.getElementById('map-overlay').classList.remove('show');
    }

    // ---------- Datos ----------
    async function fetchTrackerData() {
      try {
        const res = await fetch('/api/live');
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        consecutiveErrors = 0;

        const deviceIds = Object.keys(data);
        if (deviceIds.length === 0) {
          latestData = {};
          showOverlay('Sin dispositivos', 'Cuando un dispositivo empiece a reportar ubicación, aparecerá aquí automáticamente.');
          setConnStatus('');
          return;
        }
        hideOverlay();
        setConnStatus('');

        latestData = data;
        renderDeviceMenu();

        if (!currentFocusId || !data[currentFocusId]) selectDevice(deviceIds[0]);

        deviceIds.forEach(id => {
          const { current, history } = data[id];
          if (!current) return;

          const latLng = [current.lat, current.lon];

          if (!markers[id]) {
            markers[id] = L.marker(latLng, { icon: buildIcon(id) }).addTo(map);
          } else {
            markers[id].setLatLng(latLng);
          }

          const path = (history || []).map(p => [p.lat, p.lon]);
          if (!polylines[id]) {
            polylines[id] = L.polyline(path, { color: colorForDevice(id), weight: 4, opacity: 0.85, lineCap: 'round' }).addTo(map);
          } else {
            polylines[id].setLatLngs(path);
          }

          if (id === currentFocusId) {
            updateDetailPanel(id);
            if (autoTrack) map.setView(latLng);
          }
        });
      } catch (err) {
        console.error('Error al actualizar', err);
        consecutiveErrors += 1;
        setConnStatus(consecutiveErrors >= 3 ? 'down' : 'stale');
        if (consecutiveErrors >= 3 && Object.keys(markers).length === 0) {
          showOverlay('No se pudo conectar', 'Revisa tu conexión o vuelve a intentar en unos segundos.');
        }
      }
    }

    setInterval(fetchTrackerData, 2000);
    fetchTrackerData();
  </script>
</body>
</html>
