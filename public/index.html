<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Tracker Arcade</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    * { box-sizing: border-box; }
    body { 
      margin: 0; padding: 0; 
      font-family: 'Courier New', Courier, monospace; 
      background: #000; color: #fff; 
      display: flex; flex-direction: column; height: 100vh;
    }
    
    /* Layout de la Interfaz Pac-Man */
    #pacman-interface-layout { 
      position: relative; flex-grow: 1; display: flex; flex-direction: column;
      border: 3px solid #1919A6; margin: 5px; border-radius: 8px;
    }

    /* Indicadores Visibles de Seguimiento de Navegación */
    #navigation-tracking-indicators {
      background: #000;
      border-bottom: 3px solid #1919A6;
      padding: 12px 15px;
      display: flex; justify-content: space-between; align-items: center;
      z-index: 1000;
    }
    .nav-title { font-size: 1rem; font-weight: bold; color: #FFCC00; text-transform: uppercase; }
    #current-tracking { background: #FFCC00; color: #000; padding: 4px 10px; border-radius: 12px; font-size: 0.85rem; font-weight: bold; text-transform: uppercase; }

    #map { flex-grow: 1; width: 100%; background: #000; }
    
    .floating-btn { 
      position: absolute; z-index: 1000; 
      background: rgba(0,0,0,0.8); border: 2px solid #00e5ff; 
      color: #00e5ff; font-weight: bold; font-family: 'Courier New', monospace;
      padding: 8px 12px; border-radius: 8px; cursor: pointer; text-transform: uppercase; 
      top: 15px; right: 15px;
    }
    .floating-btn.on { background: #00e5ff; color: #000; }

    /* Componente de Sección de Comida */
    #food-section-component {
      height: 90px; 
      background: #000; 
      display: flex; justify-content: space-around; 
      align-items: center; 
      border-top: 3px solid #1919A6;
      margin: 0 5px 5px 5px;
      border-radius: 0 0 8px 8px;
    }
    .stat { text-align: center; }
    .stat-val { font-size: 1.2rem; font-weight: bold; color: #FFB8AE; }
    .stat-lbl { font-size: 0.7rem; color: #fff; text-transform: uppercase; margin-top: 4px; }
  </style>
</head>
<body>

  <div id="pacman-interface-layout">
    
    <!-- Indicadores Visibles de Seguimiento de Navegación -->
    <div id="navigation-tracking-indicators">
      <div class="nav-title">Navegando:</div>
      <div id="current-tracking">Buscando...</div>
    </div>

    <div id="map"></div>
    <button id="btn-autotrack" class="floating-btn on">Auto-Cámara</button>

    <!-- Componente de Sección de Comida -->
    <div id="food-section-component">
      <div class="stat"><div class="stat-val" id="val-food">0</div><div class="stat-lbl">Comida</div></div>
      <div class="stat"><div class="stat-val" id="val-speed">0 km/h</div><div class="stat-lbl">Velocidad</div></div>
      <div class="stat"><div class="stat-val" id="val-batt">--%</div><div class="stat-lbl">Batería</div></div>
      <div class="stat"><div class="stat-val" id="val-time">--:--</div><div class="stat-lbl">Última Señal</div></div>
    </div>

  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const map = L.map('map', { zoomControl: false }).setView([19.0433, -98.198], 15);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', { maxZoom: 19 }).addTo(map);

    const iconPacman = L.icon({
      iconUrl: 'https://upload.wikimedia.org/wikipedia/commons/4/49/Pacman.svg',
      iconSize: [32, 32],
      iconAnchor: [16, 16]
    });

    let markers = {};
    let polylines = {};
    let currentFocusId = null;
    let autoTrack = true;

    const btnAutoTrack = document.getElementById('btn-autotrack');
    btnAutoTrack.onclick = () => {
      autoTrack = !autoTrack;
      btnAutoTrack.className = autoTrack ? 'floating-btn on' : 'floating-btn';
    };

    map.on('dragstart', () => { if (autoTrack) btnAutoTrack.click(); });

    async function fetchTrackerData() {
      try {
        const res = await fetch('/api/live');
        const data = await res.json();
        
        const deviceIds = Object.keys(data);
        if (deviceIds.length === 0) return;

        if (!currentFocusId) currentFocusId = deviceIds[0];
        document.getElementById('current-tracking').innerText = currentFocusId;

        deviceIds.forEach(id => {
          const { current, history } = data[id];
          if (!current) return;

          const latLng = [current.lat, current.lon];

          if (!markers[id]) {
            markers[id] = L.marker(latLng, { icon: iconPacman }).addTo(map);
          } else {
            markers[id].setLatLng(latLng);
          }

          const path = history.map(p => [p.lat, p.lon]);
          if (!polylines[id]) {
            polylines[id] = L.polyline(path, { color: '#FFCC00', weight: 4, dashArray: '5, 15', lineCap: 'round' }).addTo(map);
          } else {
            polylines[id].setLatLngs(path);
          }
          
          if(id === currentFocusId) {
            document.getElementById('val-food').innerText = history.length;
            document.getElementById('val-speed').innerText = `${Math.round(current.speed * 3.6)} km/h`;
            document.getElementById('val-batt').innerText = `${current.battery}%`;
            
            // Nueva actualización de fecha solicitada
            const timestamp = new Date(current.timestamp);
            document.getElementById('val-time').innerText = timestamp.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit', second:'2-digit'});
            
            if (autoTrack) map.setView(latLng);
          }
        });
      } catch (err) {}
    }

    // Intervalo exacto de 2 segundos
    setInterval(fetchTrackerData, 2000);
    fetchTrackerData();
  </script>
</body>
</html>
